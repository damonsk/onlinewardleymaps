    dependencies: ["EPIC-010"]
    exit_criteria:
      - "Current Wardley view renders through a stable adapter."
      - "Domain tests run without a browser."
      - "Renderer-neutral semantic snapshots are available."
    tasks:
      - id: "ARCH-001"
        title: "Create graph facade over current state"
      - id: "ARCH-002"
        title: "Represent current coordinates in a default Wardley view"
      - id: "ARCH-003"
        title: "Define application command/query boundary"
      - id: "ARCH-004"
        title: "Define resolved display graph contract"
      - id: "ARCH-005"
        title: "Adapt existing renderer and prove equivalence"
      - id: "ARCH-006"
        title: "Enforce or review dependency direction"

