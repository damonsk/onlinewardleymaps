backlog_version: "0.1"
status: "Repository audit complete; M0 evidence in progress"
principles:
  - "Order work by dependency and risk reduction."
  - "Keep the existing application releasable."
  - "Every persisted change has migration and round-trip tests."
  - "Each epic exits through a usable vertical slice."

epics:
  - id: "EPIC-000"
    title: "Repository audit and baseline"
    milestone: "M0"
    requirements: ["CTX-001", "CTX-002", "CTX-003", "TST-001", "AGT-001"]
    dependencies: []
    exit_criteria:
      - "Clean checkout builds and runs from recorded commands."
      - "Critical current flows have characterization tests."
      - "Format, identity, renderer, state, undo, and deployment are documented."
    tasks:
      - id: "AUD-001"
        title: "Record exact fork, branch, commit, upstream, and licences"
      - id: "AUD-002"
        title: "Run install, development, build, test, lint, type-check, and deployment paths"
      - id: "AUD-003"
        title: "Trace create/move node, edge edit, open, save/export, and undo/redo flows"
      - id: "AUD-004"
        title: "Inventory domain representations, coordinate semantics, and stable identity"
      - id: "AUD-005"
        title: "Create current format and compatibility matrix"
      - id: "AUD-006"
        title: "Baseline accessibility, security, and performance"
      - id: "AUD-007"
        title: "Add minimum characterization suite"
      - id: "AUD-008"
        title: "Map target architecture responsibilities to actual modules"

  - id: "EPIC-010"
    title: "Identity, schema versioning, and test harness"
    milestone: "M1"
    requirements: ["MOD-002", "FMT-001", "FMT-002", "FMT-003", "FMT-004", "FMT-005", "TST-002", "TST-003", "TST-005"]
    dependencies: ["EPIC-000"]
    exit_criteria:
      - "Stable IDs survive rename, reorder, save, and reload."
      - "Supported legacy inputs migrate deterministically."
      - "Native round-trip and diagnostic tests run in CI."
    tasks:
      - id: "ID-001"
        title: "Approve repository-specific stable ID strategy"
      - id: "ID-002"
        title: "Implement legacy ID mapping or migration"
      - id: "FMT-001"
        title: "Add schema-version detection and structured diagnostics"
      - id: "FMT-002"
        title: "Implement sequential migration harness"
      - id: "FMT-003"
        title: "Canonicalize deterministic serialization"
      - id: "COR-001"
        title: "Create project-owned fixture manifest and first synthetic maps"
      - id: "CI-001"
        title: "Add migration, schema, round-trip, and documentation validation gates"

  - id: "EPIC-020"
