name: Application baseline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: yarn
          cache-dependency-path: |
            frontend/yarn.lock
            api/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Install API dependencies
        working-directory: api
        run: yarn install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: yarn lint:check

      - name: Test frontend
        working-directory: frontend
        run: yarn test --runInBand

      - name: Test API persistence
        working-directory: api
        run: yarn test

      - name: Build frontend
        working-directory: frontend
        run: yarn build

      - name: Smoke frontend production server
        working-directory: frontend
        run: |
          yarn start -p 3010 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3010/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Build API
        working-directory: api
        run: yarn build

      - name: Smoke API production server
        working-directory: api
        run: |
          data_dir="$(mktemp -d)"
          PORT=3001 DATA_DIR="$data_dir" yarn start &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$data_dir"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: roadmap/requirements.txt

      - name: Install roadmap validation dependencies
        run: python -m pip install --requirement roadmap/requirements.txt

      - name: Validate roadmap pack
        run: python roadmap/tools/validate_pack.py
